name: lingchao-co-create

services:
  mysql:
    image: docker.1ms.run/library/mysql:8.4
    container_name: lingchao-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lingchao}
      MYSQL_USER: ${MYSQL_USER:-lingchao}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lingchao_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [lingchao]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lingchao-backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-岭潮共创}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      API_V1_PREFIX: /api/v1
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-lingchao}:${MYSQL_PASSWORD:-lingchao_dev}@mysql:3306/${MYSQL_DATABASE:-lingchao}?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-before-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TEMPERATURE: "${DEEPSEEK_TEMPERATURE:-0.7}"
      DEEPSEEK_TIMEOUT_SECONDS: "${DEEPSEEK_TIMEOUT_SECONDS:-30}"
      IMAGE_GENERATOR_PROVIDER: ${IMAGE_GENERATOR_PROVIDER:-mock}
      ZHIPU_API_KEY: "${ZHIPU_API_KEY:-}"
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      ZHIPU_IMAGE_MODEL: ${ZHIPU_IMAGE_MODEL:-cogview-4-250304}
      ZHIPU_IMAGE_SIZE: ${ZHIPU_IMAGE_SIZE:-768x1344}
      ZHIPU_IMAGE_QUALITY: ${ZHIPU_IMAGE_QUALITY:-standard}
      ZHIPU_IMAGE_WATERMARK_ENABLED: "${ZHIPU_IMAGE_WATERMARK_ENABLED:-true}"
      ZHIPU_IMAGE_TIMEOUT_SECONDS: "${ZHIPU_IMAGE_TIMEOUT_SECONDS:-90}"
      ZHIPU_IMAGE_MAX_RETRIES: "${ZHIPU_IMAGE_MAX_RETRIES:-2}"
      ZHIPU_IMAGE_RETRY_DELAY_SECONDS: "${ZHIPU_IMAGE_RETRY_DELAY_SECONDS:-1}"
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/app/work/model-cache}
      RAG_KNOWLEDGE_DIR: ${RAG_KNOWLEDGE_DIR:-/app/data/knowledge_base}
      RAG_PROMPT_PATH: ${RAG_PROMPT_PATH:-/app/data/prompts/rag_chat.txt}
      IMAGE_PROMPT_PATH: ${IMAGE_PROMPT_PATH:-/app/data/prompts/image_prompt.txt}
      RAG_VECTOR_STORE_DIR: ${RAG_VECTOR_STORE_DIR:-/app/work/chroma}
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-lingnan_knowledge}
      RAG_TOP_K: "${RAG_TOP_K:-5}"
      RAG_MIN_SCORE: "${RAG_MIN_SCORE:-0.45}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # AI knowledge base and prompt templates.
      - ./data:/app/data:ro
      # Community demo seed resolves repository data from /data.
      - ./data:/data:ro
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lingchao]

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: lingchao-frontend-user
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_PROXY_TARGET: http://backend:8000
      VITE_AMAP_KEY: "${VITE_AMAP_KEY:-}"
      VITE_AMAP_SECURITY_CODE: "${VITE_AMAP_SECURITY_CODE:-}"
    ports:
      - "3000:5173"
    volumes:
      - ./frontend-user:/app
      - frontend_user_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks: [lingchao]

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: lingchao-frontend-admin
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "3001:5174"
    volumes:
      - ./frontend-admin:/app
      - frontend_admin_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks: [lingchao]

networks:
  lingchao:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
  frontend_user_node_modules:
  frontend_admin_node_modules:
