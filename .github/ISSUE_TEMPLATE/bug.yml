name: 缺陷报告
description: 报告可复现的功能或部署问题
title: "[Bug][模块] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: develop / commit SHA / browser
  - type: textarea
    id: evidence
    attributes:
      label: 日志、requestId、截图或录屏

